name: Build AVEIN

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore AVEIN.csproj

      - name: Publish (self-contained, folder)
        run: dotnet publish AVEIN.csproj -c Release -r win-x64 --self-contained true -o build_output

      - name: Verify output
        run: dir build_output

      - name: Upload built app
        uses: actions/upload-artifact@v4
        with:
          name: AVEIN-app
          path: build_output
          if-no-files-found: error
          retention-days: 30
