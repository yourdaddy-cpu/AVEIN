name: Build AVEIN

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore AVEIN.csproj
      - name: Build
        run: dotnet build AVEIN.csproj -c Release -o build_output
      - name: Upload built app
        uses: actions/upload-artifact@v4
        with:
          name: AVEIN-exe
          path: build_output
